<script>
// Track a Lead when the WhatsApp invitation button is clicked.
// This does not confirm that a visitor joined the group.
document.getElementById('JOIN BUTTON').addEventListener('click', function () {
  if (typeof window.fbq === 'function') {
    fbq('track', 'Lead');
  }
});

// Animated blue particles
(function () {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');

  if (!ctx) return;

  let width = 0;
  let height = 0;
  let particles = [];

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.min(55, Math.max(20, Math.floor(width / 8)));

    particles = Array.from({ length: count }, function () {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 0.35 + 0.1,
        opacity: Math.random() * 0.55 + 0.15
      };
    });
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);

    particles.forEach(function (p) {
      p.y -= p.speed;

      if (p.y < -5) {
        p.y = height + 5;
        p.x = Math.random() * width;
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,170,255,' + p.opacity + ')';
      ctx.fill();
    });

    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  animate();
})();
</script>
